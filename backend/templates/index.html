<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zapatex - Venta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .boton-agregar {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .sucursal img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      margin-right: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Venta Zapatex</h1>

  <a href="/agregar_producto" class="boton-agregar">+ Agregar Producto</a>

  <label for="buscar">Buscar producto:</label>
  <input type="text" id="buscar" placeholder="Escribe producto..." />

  <p id="cargando" style="display: none;">Cargando productos...</p>

  <div id="sucursales-list"></div>

  <div class="separador"></div>

  <strong>Casa Matriz</strong>
  <div id="casa-matriz"></div>

  <label for="sucursal">Sucursales:</label>
  <select id="sucursal"></select>

  <div class="acciones">
    <div>
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" min="1" value="1">
    </div>
    <button id="calcular">Calcular Total USD</button>
    <button id="vender">Venta</button>
  </div>

  <p id="total"></p>

  <div id="alerta-stock"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

  <!-- 🔴 Script SSE para recibir alertas de stock bajo -->
  <script>
    const sse = new EventSource("/stream_stock_bajo");
    sse.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.length > 0) {
        const mensajes = data.map(e => `🟠 ${e.producto} en ${e.sucursal} tiene solo ${e.cantidad} unidades`).join("<br>");
        document.getElementById("alerta-stock").innerHTML = `
          <div style="background: #fff3cd; color: #856404; padding: 10px; border: 1px solid #ffeeba; border-radius: 4px; margin-top: 20px;">
            <strong>⚠️ Stock Bajo Detectado:</strong><br>${mensajes}
          </div>
        `;
      }
    };
  </script>

</body>
</html>
