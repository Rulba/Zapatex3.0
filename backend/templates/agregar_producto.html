<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Producto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .formulario {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .formulario input, .formulario button {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .volver {
      display: inline-block;
      margin: 15px;
      padding: 8px 12px;
      background: #888;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <a href="/" class="volver">← Volver a la tienda</a>

  <div class="formulario">
    <h2>Agregar Producto</h2>
    <input type="text" id="nombre" placeholder="Nombre del producto" required />
    <input type="number" id="precio" placeholder="Precio CLP" required />
    <input type="text" id="tipo" placeholder="Tipo de producto (opcional)" />

    <h4>Stock por sucursal</h4>
    <input type="number" id="stock1" placeholder="Sucursal 1 - Cantidad" />
    <input type="number" id="stock2" placeholder="Sucursal 2 - Cantidad" />
    <input type="number" id="stock3" placeholder="Sucursal 3 - Cantidad" />
    <input type="number" id="matriz" placeholder="Casa Matriz - Cantidad" />

    <label>Imagen del producto</label>
    <input type="file" id="imagen" accept="image/*" />

    <button onclick="guardarProducto()">Guardar Producto</button>
    <p id="mensaje"></p>
  </div>

  <script>
    async function guardarProducto() {
      const nombre = document.getElementById("nombre").value;
      const precio = document.getElementById("precio").value;
      const tipo = document.getElementById("tipo").value;
      const imagenInput = document.getElementById("imagen");
      const mensaje = document.getElementById("mensaje");

      const stock = {
        "Sucursal 1": parseInt(document.getElementById("stock1").value) || 0,
        "Sucursal 2": parseInt(document.getElementById("stock2").value) || 0,
        "Sucursal 3": parseInt(document.getElementById("stock3").value) || 0,
        "Casa Matriz": parseInt(document.getElementById("matriz").value) || 0
      };

      if (!nombre || !precio || !imagenInput.files[0]) {
        alert("Debes completar nombre, precio e imagen.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async function () {
        const base64 = reader.result.split(',')[1];

        const payload = {
          nombre,
          precio,
          tipo,
          stock,
          imagen_base64: base64
        };

        try {
          const res = await fetch('/api/agregar_producto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (res.ok) {
            mensaje.textContent = "✅ Producto agregado correctamente";
            mensaje.style.color = "green";
          } else {
            mensaje.textContent = "❌ Error: " + (data.error || "Error desconocido");
            mensaje.style.color = "red";
          }
        } catch (err) {
          mensaje.textContent = "❌ Error de red o del servidor";
          mensaje.style.color = "red";
        }
      };
      reader.readAsDataURL(imagenInput.files[0]);
    }
  </script>
</body>
</html>
